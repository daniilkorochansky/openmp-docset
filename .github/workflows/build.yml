name: Build & Rolling Update open.mp Docset

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Принудительная пересборка (игнорировать проверку коммита)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check upstream changes in frontend/docs
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API_URL="https://api.github.com/repos/openmultiplayer/web/commits?path=frontend/docs&per_page=1"
          RESPONSE=$(curl -sL -H "User-Agent: GitHub-Actions" -H "Accept: application/vnd.github+json" "$API_URL")
          LATEST_SHA=$(echo "$RESPONSE" | jq -r '.[0].sha // empty')
          
          echo "Upstream SHA: $LATEST_SHA"
          echo "latest_sha=$LATEST_SHA" >> $GITHUB_OUTPUT

          CURRENT_SHA=""
          REL_URL="https://github.com/${{ github.repository }}/releases/download/latest/version.json"
          if curl -sfL "$REL_URL" -o old_version.json; then
            CURRENT_SHA=$(jq -r '.commit_sha // empty' old_version.json)
          fi
          echo "Current release SHA: $CURRENT_SHA"

          if [ "${{ github.event.inputs.force_build }}" == "true" ]; then
            echo "Force build requested."
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [ -n "$LATEST_SHA" ] && [ "$LATEST_SHA" != "$CURRENT_SHA" ]; then
            echo "New documentation changes detected (or initial build)."
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "Documentation is up to date. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Sparse checkout open.mp docs
        if: steps.check.outputs.should_build == 'true'
        run: |
          REPO_URL="https://github.com/openmultiplayer/web.git"
          git clone --filter=blob:none --no-checkout --depth 1 "$REPO_URL" upstream
          cd upstream
          git sparse-checkout init --cone
          git sparse-checkout set frontend/docs
          git checkout master

      - name: Build Docset and metadata
        if: steps.check.outputs.should_build == 'true'
        run: |
          pip install markdown beautifulsoup4 pygments
          python build_docset.py upstream/frontend/docs
          
          tar -czf openmp.docset.tgz openmp.docset
          
          python -c "
          import json, datetime
          data = {
              'commit_sha': '${{ steps.check.outputs.latest_sha }}',
              'updated_at': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'download_url': 'https://github.com/${{ github.repository }}/releases/download/latest/openmp.docset.tgz'
          }
          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
          "

      - name: Rolling Update GitHub Release
        if: steps.check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "open.mp Documentation (Latest)"
          body: |
            Автоматическая сборка документации **open.mp** в формате Docset (для Zeal, Dash и встроенных просмотрщиков).
            
            * **Исходный коммит:** `openmultiplayer/web@${{ steps.check.outputs.latest_sha }}`
          prerelease: false
          make_latest: true
          files: |
            openmp.docset.tgz
            version.json
